name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm install

      - name: Preparar carpeta www y capacitor.config.json
        run: |
          mkdir -p www
          cp -r *.html *.js *.css manifest.json icon.png www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mimusica.player",
            "appName": "Mi Total Player",
            "webDir": "www"
          }
          EOF

      - name: Generar Plataforma Android limpia
        run: npx cap add android

      - name: Inyectar Permisos en AndroidManifest.xml
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' android/app/src/main/AndroidManifest.xml

      - name: Inyectar MainActivity Nativa (Escáner de MiMusica + Soporte COVERS)
        run: |
          mkdir -p android/app/src/main/java/com/mimusica/player
          cat << 'EOF' > android/app/src/main/java/com/mimusica/player/MainActivity.java
          package com.mimusica.player;

          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileInputStream;
          import java.util.Base64;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void cargarMusica() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              escanearCarpetaMiMusica();
                          }
                      });
                  }
              }

              private void escanearCarpetaMiMusica() {
                  JSONObject biblioteca = new JSONObject();
                  JSONObject covers = new JSONObject();
                  try {
                      File miMusicaDir = new File(Environment.getExternalStorageDirectory(), "MiMusica");
                      if (miMusicaDir.exists() && miMusicaDir.isDirectory()) {
                          File[] rootFiles = miMusicaDir.listFiles();

                          if (rootFiles != null) {
                              for (File albumDir : rootFiles) {
                                  if (albumDir.isDirectory()) {
                                      String albumName = albumDir.getName();
                                      JSONArray cancionesArray = new JSONArray();
                                      File[] files = albumDir.listFiles();

                                      if (files != null) {
                                          for (File file : files) {
                                              String fileName = file.getName().toLowerCase();

                                              // 1. Si es un archivo de audio dentro del álbum
                                              if (file.isFile() && esAudio(fileName)) {
                                                  JSONObject cancion = new JSONObject();
                                                  cancion.put("nombre", file.getName().replaceAll("\\.[^/.]+$", ""));
                                                  cancion.put("archivo", "file://" + file.getAbsolutePath());
                                                  cancionesArray.put(cancion);
                                              } 
                                              // 2. Si es la carpeta COVERS o una imagen suelta
                                              else if (file.isDirectory() && fileName.equalsIgnoreCase("covers")) {
                                                  File[] coverFiles = file.listFiles();
                                                  if (coverFiles != null) {
                                                      for (File coverFile : coverFiles) {
                                                          if (esImagen(coverFile.getName().toLowerCase())) {
                                                              String b64 = convertirImagenABase64(coverFile);
                                                              if (b64 != null) {
                                                                  covers.put(albumName.toLowerCase(), b64);
                                                                  break; // Toma la primera imagen válida de COVERS
                                                              }
                                                          }
                                                      }
                                                  }
                                              } else if (file.isFile() && esImagen(fileName)) {
                                                  String b64 = convertirImagenABase64(file);
                                                  if (b64 != null) {
                                                      covers.put(albumName.toLowerCase(), b64);
                                                  }
                                              }
                                          }
                                      }

                                      if (cancionesArray.length() > 0) {
                                          biblioteca.put(albumName, cancionesArray);
                                      }
                                  }
                              }
                          }
                      }
                  } catch (Exception e) {}

                  WebView webView = this.bridge.getWebView();
                  String jsCall = String.format("window.recibirBibliotecaNativa(%s, %s);", biblioteca.toString(), covers.toString());
                  webView.evaluateJavascript(jsCall, null);
              }

              private boolean esAudio(String fileName) {
                  return fileName.endsWith(".mp3") || fileName.endsWith(".wav") || fileName.endsWith(".m4a") || 
                         fileName.endsWith(".aac") || fileName.endsWith(".ogg") || fileName.endsWith(".flac") || 
                         fileName.endsWith(".opus") || fileName.endsWith(".wma");
              }

              private boolean esImagen(String fileName) {
                  return fileName.endsWith(".jpg") || fileName.endsWith(".png") || fileName.endsWith(".jpeg") || fileName.endsWith(".webp");
              }

              private String convertirImagenABase64(File file) {
                  try {
                      FileInputStream fis = new FileInputStream(file);
                      byte[] bytes = new byte[(int) file.length()];
                      fis.read(bytes);
                      fis.close();
                      return "data:image/jpeg;base64," + Base64.getEncoder().encodeToString(bytes);
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          EOF

      - name: Sincronizar archivos Web en Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir ejecutable APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
