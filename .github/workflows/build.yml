name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install

    - name: Clean and Rebuild Android Project
      run: |
        rm -rf android
        npx cap add android

    - name: Generate App Icons from icon.png
      run: |
        npx capacitor-assets generate --android

    - name: Sync Web Assets to Native Project
      run: |
        npx cap sync android

    - name: Inject Android Storage Permissions
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiPlayer-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
