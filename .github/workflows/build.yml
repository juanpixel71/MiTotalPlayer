name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Construir Carpeta Web
        run: npm run build

      - name: Añadir Plataforma Android
        run: npx cap add android

      # Punto 1: Generación respetando transparencia original
      - name: Generar Iconos de la Aplicación
        run: npx capacitor-assets generate --iconBackgroundColor 'transparent'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Ajustar Permisos AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS='<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.INTERNET" />'
          sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' $MANIFEST
          sed -i "/<application/i $PERMS" $MANIFEST
          sed -i 's/<application /<application android:requestLegacyExternalStorage="true" /' $MANIFEST

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiTotalPlayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
