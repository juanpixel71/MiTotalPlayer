name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install -g cordova-res

    - name: Generate App Icons from icon.png
      run: |
        mkdir -p resources
        cp icon.png resources/icon.png
        cordova-res android --skip-splash

    - name: Sync Web Assets to Native Project
      run: |
        npx cap sync android

    - name: Copy Generated Icons to Android Folder
      run: |
        cp -R resources/android/icon/* android/app/src/main/res/

    - name: Build Android APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiPlayer-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
