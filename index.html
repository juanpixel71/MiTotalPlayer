<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Total Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section id="screen-home" class="screen active">
        <header class="app-header">
            <h1>MI TOTAL PLAYER</h1>
        </header>
        <main class="content-area">
            <button class="btn-main-home" id="btn-nav-tv">
                <span>📺</span> TV-NEWS
            </button>
            <button class="btn-main-home" id="btn-nav-music">
                <span>🎵</span> MÚSICA
            </button>
            <button class="btn-main-home" id="btn-nav-radio">
                <span>📻</span> RADIO
            </button>
        </main>
    </section>

    <section id="screen-tv" class="screen">
        <header class="app-header">
            <h1>TV-NEWS</h1>
        </header>
        <main class="content-area">
            <div class="video-container">
                <video id="tv-player" controls playsinline></video>
            </div>
            <div class="grid-buttons">
                <button class="btn-item btn-tv-channel" data-url="https://live.france24.com/hls/live/2037179-b/F24_FR_HI_HLS/master_5000.m3u8">FRANCE 24</button>
                <button class="btn-item btn-tv-channel" data-url="https://ncdn-live-bfm.pfd.sfr.net/shls/LIVE$BFM_TV/index.m3u8">BFM TV</button>
                <button class="btn-item btn-tv-channel" data-url="https://ztnr.rtve.es/ztnr/1694255.m3u8">24 HORAS</button>
            </div>
            <button class="btn-back-footer btn-go-home">◄ VOLVER AL MENÚ</button>
        </main>
    </section>

    <section id="screen-music" class="screen">
        <header class="app-header">
            <h1>MÚSICA LOCAL</h1>
        </header>
        <main class="content-area">
            <button class="btn-item" id="btn-load-local-files" style="padding: 20px;">
                📂 Cargar carpeta /MiMusica
            </button>
            <div id="music-list" class="grid-buttons"></div>
            <button class="btn-back-footer btn-go-home">◄ VOLVER AL MENÚ</button>
        </main>
    </section>

    <section id="screen-radio" class="screen">
        <header class="app-header">
            <h1>RADIO ONLINE</h1>
        </header>
        <main class="content-area">
            <div class="grid-buttons">
                <button class="btn-item btn-radio-channel" data-url="https://stream.radiofrance.fr/franceinfo/franceinfo_hifi.m3u8">FRANCE INFO</button>
                <button class="btn-item btn-radio-channel" data-url="https://rtvelivestream.rtve.es/rtvesec/rne/rne_r1_main.m3u8">RNE 1</button>
            </div>
            <audio id="radio-player" controls style="width: 100%; margin-top: 10px;"></audio>
            <button class="btn-back-footer btn-go-home">◄ VOLVER AL MENÚ</button>
        </main>
    </section>

    <script src="app.js"></script>
</body>
</html>
