<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: content: blob: https: http:;">
  <title>Mi Total Player</title>

  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <style>
    /* ==========================================
       ESTILOS GENERALES Y RESET
       =========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      background-color: #121212;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* PANTALLAS */
    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #121212;
    }

    .screen.active {
      display: flex;
    }

    /* HEADER */
    .app-header {
      background-color: #1e1e1e;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .app-header h1 {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
    }

    /* BARRA SUPERIOR DE BOTONES (NAVEGACIÓN) */
    .nav-bar {
      display: flex;
      background-color: #2a2a2a;
      padding: 5px;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-nav {
      flex: 1;
      padding: 10px;
      background-color: #3a3a3a;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .btn-nav.active {
      background-color: #e50914;
    }

    /* ==========================================
       PANTALLA TV-NEWS (PORTRAIT Y LANDSCAPE)
       =========================================== */
    #screen-tv {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
    }

    #screen-tv.active {
      display: flex;
    }

    /* CONTENEDOR REPRODUCTOR */
    .tv-video-container {
      width: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .tv-video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* AREA DE BOTONES Y CANALES */
    .tv-content-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
    }

    .buttons-grid {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .btn-stream {
      background-color: #2a2a2a;
      color: white;
      padding: 12px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-stream.active-channel {
      background-color: #e50914 !important;
      color: #ffffff !important;
    }

    /* --- RESPONSIVE / ORIENTACIÓN TV-NEWS --- */

    /* VERTICAL (PORTRAIT) */
    @media (orientation: portrait) {
      #screen-tv {
        flex-direction: column;
      }

      .tv-video-container {
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      .buttons-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }
    }

    /* HORIZONTAL (LANDSCAPE) */
    @media (orientation: landscape) {
      #screen-tv {
        flex-direction: column;
      }

      .tv-video-container {
        width: 100% !important;
        max-height: 55vh;
        aspect-ratio: 16 / 9;
      }

      .buttons-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <nav class="nav-bar">
      <div class="btn-nav active" onclick="mostrarPantalla('screen-tv')">TV-NEWS</div>
      <div class="btn-nav" onclick="mostrarPantalla('screen-musica')">MÚSICA</div>
      <div class="btn-nav" onclick="mostrarPantalla('screen-radio')">RADIO</div>
    </nav>

    <section id="screen-tv" class="screen active">

      <div class="tv-video-container">
        <video id="tvPlayer" controls playsinline poster="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23666666'><path d='M8 5v14l11-7z'/></svg>">
          Tu navegador no soporta el reproductor de vídeo.
        </video>
      </div>

      <div class="tv-content-layout">
        <div id="statusMessage" style="text-align: center; margin-bottom: 8px; font-size: 0.85rem; color: #aaa;">
          Cargando canales...
        </div>
        
        <div id="tv-buttons-grid" class="buttons-grid">
          </div>
      </div>

    </section>

    <section id="screen-musica" class="screen">
      <header class="app-header">
        <h1>MÚSICA LOCAL</h1>
      </header>
      <div style="padding: 20px; text-align: center;">
        <button onclick="solicitarPermisosYLeerMusica()" style="padding: 12px 20px; background-color: #e50914; color: white; border-radius: 5px; font-weight: bold;">
          Cargar Música de la Carpeta Local
        </button>
        <div id="music-list" style="margin-top: 15px;"></div>
      </div>
    </section>

    <section id="screen-radio" class="screen">
      <header class="app-header">
        <h1>RADIO ONLINE</h1>
      </header>
      <div style="padding: 20px; text-align: center;">
        <p>Sección Radio en directo</p>
      </div>
    </section>

  </div>

  <script>
    // CAMBIO DE PANTALLAS
    function mostrarPantalla(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));

      const target = document.getElementById(id);
      if (target) target.classList.add('active');
    }

    // MANEJO DE CORDOVA & PANTALLA SIEMPRE ENCENDIDA
    document.addEventListener('deviceready', function () {
      // PANTALLA SIEMPRE ENCENDIDA (Insomnia / WakeLock)
      if (window.plugins && window.plugins.insomnia) {
        window.plugins.insomnia.keepAwake();
      }

      // MODO INMERSIVO / FULLSCREEN
      if (window.AndroidFullScreen) {
        window.AndroidFullScreen.immersiveMode(null, null);
      }
    }, false);

    // VINCULACIÓN Y LECTURA DE ARCHIVOS DE MÚSICA EN CORDOVA
    function solicitarPermisosYLeerMusica() {
      if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
        const permissions = cordova.plugins.permissions;
        const permiso = permissions.READ_MEDIA_AUDIO || permissions.READ_EXTERNAL_STORAGE;

        permissions.checkPermission(permiso, function (status) {
          if (!status.hasPermission) {
            permissions.requestPermission(permiso, function (status) {
              if (status.hasPermission) leerArchivosMusica();
            });
          } else {
            leerArchivosMusica();
          }
        });
      } else {
        alert("Función disponible al ejecutar la app en el dispositivo móvil.");
      }
    }

    function leerArchivosMusica() {
      const musicFolder = cordova.file.externalRootDirectory + "Music/";
      window.resolveLocalFileSystemURL(musicFolder, function (dirEntry) {
        const dirReader = dirEntry.createReader();
        dirReader.readEntries(function (entries) {
          const listContainer = document.getElementById('music-list');
          listContainer.innerHTML = '';
          entries.forEach(entry => {
            if (entry.isFile) {
              const item = document.createElement('div');
              item.innerText = entry.name;
              item.style.padding = "8px";
              item.style.borderBottom = "1px solid #333";
              listContainer.appendChild(item);
            }
          });
        });
      }, function (err) {
        alert("No se pudo acceder a la carpeta Music.");
      });
    }
  </script>
</body>
</html>
