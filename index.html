<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Total Player</title>
  <style>
    /* RESET & ESTILOS BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 2. HEADER CON ESPACIO SEGURA PARA NOTCH */
    header {
      background-color: #1f1f1f;
      padding-top: max(env(safe-area-inset-top), 24px);
      padding-bottom: 12px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #333;
      margin-bottom: 10px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .vistas {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .vista-activa {
      display: flex;
    }

    /* BOTONES GLOBALES UNIFICADOS (Punto 3.2) */
    .btn {
      background-color: #282828;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      background-color: #3e3e3e;
      transform: scale(0.98);
    }

    .btn-volver {
      margin-top: 15px;
      background-color: #333;
      border-color: #555;
    }

    /* VISTA HOME */
    .grid-home {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    /* VISTA ÁLBUMES Y LISTAS */
    .grid-albumes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }

    .card-album {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .card-album img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .lista-canciones {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-cancion {
      background: #242424;
      padding: 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 5. PANTALLA REPRODUCTOR DE MÚSICA */
    .reproductor-musica {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 0;
    }

    /* 5.2 Carátula del álbum más grande */
    .album-cover-player {
      width: 260px;
      height: 260px;
      max-width: 80vw;
      max-height: 80vw;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }

    .track-info {
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .track-album {
      font-size: 0.95rem;
      color: #aaa;
    }

    /* 5.3 Separación de los controles de reproducción */
    .music-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 35px;
    }

    .btn-control {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* 3. TV-NEWS & REPRODUCTOR DE VIDEO */
    .video-container {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .grid-canales {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    /* 6. PANTALLA RADIO (ESPACIADOS COMPENSADOS) */
    .radio-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: calc(100vh - 120px);
      padding: 10px 0;
    }

    .radio-info {
      text-align: center;
      margin-bottom: 15px;
    }

    .radio-bar {
      width: 100%;
      margin: 25px 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <header id="main-header">
    <span id="header-title">MI TOTAL PLAYER</span>
  </header>

  <div class="container">

    <!-- VISTA HOME -->
    <div id="vista-home" class="vistas vista-activa">
      <div class="grid-home">
        <button class="btn" onclick="navegarA('vista-albumes')">🎵 ÁLBUMES</button>
        <button class="btn" onclick="navegarA('vista-radio')">📻 RADIO</button>
        <button class="btn" onclick="navegarA('vista-tv')">📺 TV NEWS</button>
      </div>
    </div>

    <!-- VISTA ÁLBUMES -->
    <div id="vista-albumes" class="vistas">
      <div id="contenedor-albumes" class="grid-albumes">
        <!-- Se rellena dinámicamente -->
      </div>
      <button class="btn btn-volver" onclick="navegarA('vista-home')">&lt; VOLVER A HOME</button>
    </div>

    <!-- VISTA LISTA CANCIONES -->
    <div id="vista-canciones" class="vistas">
      <h3 id="nombre-album-actual" style="margin-bottom: 15px;"></h3>
      <ul id="contenedor-canciones" class="lista-canciones">
        <!-- Se rellena dinámicamente -->
      </ul>
      <button class="btn btn-volver" onclick="navegarA('vista-albumes')">&lt; VOLVER A ÁLBUMES</button>
    </div>

    <!-- VISTA REPRODUCTOR MÚSICA -->
    <div id="vista-player" class="vistas">
      <div class="reproductor-musica">
        <img id="player-cover-img" class="album-cover-player" src="icon.png" alt="Portada">
        
        <div class="track-info">
          <div id="player-song-title" class="track-title">Canción</div>
          <div id="player-album-title" class="track-album">Álbum</div>
        </div>

        <!-- 5.3 Controles de Reproducción -->
        <div class="music-controls">
          <button class="btn btn-control" onclick="cancionAnterior()">⏮</button>
          <button id="btn-play-pause" class="btn btn-control" onclick="togglePlayPause()">▶</button>
          <button class="btn btn-control" onclick="cancionSiguiente()">⏭</button>
        </div>

        <!-- 5.3 Separa los botones del botón de volver -->
        <button class="btn btn-volver" onclick="volverACanciones()">&lt; VOLVER A CANCIONES</button>
      </div>
    </div>

    <!-- VISTA RADIO -->
    <div id="vista-radio" class="vistas">
      <!-- 6. Espaciados distribuidos -->
      <div class="radio-container">
        <div class="radio-info">
          <h2 id="radio-estacion-actual">Selecciona Emisora</h2>
        </div>

        <div class="grid-canales">
          <button class="btn" onclick="sintonizarRadio('Radio 1', 'https://rtvestream-radio1.rtve.es/radio1_main.mp3')">Radio 1</button>
          <button class="btn" onclick="sintonizarRadio('SER', 'https://cadena-ser.stream.flumotion.com/cadena-ser/main.mp3')">SER</button>
          <button class="btn" onclick="sintonizarRadio('COPE', 'https://cope-cope-ss.flumotion.com/cope/main.mp3')">COPE</button>
        </div>

        <div class="radio-bar">
          <button id="btn-radio-play" class="btn btn-control" style="margin: 0 auto;" onclick="toggleRadioPlay()">▶</button>
        </div>

        <button class="btn btn-volver" onclick="navegarA('vista-home')">&lt; VOLVER A HOME</button>
      </div>
    </div>

    <!-- VISTA TV NEWS -->
    <div id="vista-tv" class="vistas">
      <div class="video-container">
        <!-- 5. Transición limpia: sin poster ni overlays de play -->
        <video id="tv-video" controls playsinline autoplay></video>
      </div>

      <div class="grid-canales">
        <button class="btn" onclick="cambiarCanalTV('https://rtvestream-24h.rtve.es/24h_main.m3u8')">24h RTVE</button>
        <button class="btn" onclick="cambiarCanalTV('https://stream.ecn.cl/live/32.m3u8')">Noticias 2</button>
        <!-- 3.2 Botón volver integrado al final del grid de botones -->
        <button class="btn btn-volver" onclick="navegarA('vista-home')">&lt; VOLVER HOME</button>
      </div>
    </div>

  </div>

  <script>
    // ESTADO DE LA APLICACIÓN
    let bibliotecaNativa = {};
    let coversNativas = {};
    let listaCancionesActuales = [];
    let indiceCancionActual = 0;
    let albumActualNombre = '';

    const audioPlayer = new Audio();
    const radioPlayer = new Audio();
    const tvVideo = document.getElementById('tv-video');

    // NAVEGACIÓN ENTRE VISTAS
    function navegarA(vistaId) {
      document.querySelectorAll('.vistas').forEach(v => v.classList.remove('vista-activa'));
      document.getElementById(vistaId).classList.add('vista-activa');

      // Si se sale de la TV o de la Radio, pausamos para no solapar audio
      if (vistaId !== 'vista-tv') {
        tvVideo.pause();
        tvVideo.src = '';
      }
      if (vistaId !== 'vista-radio') {
        radioPlayer.pause();
        radioPlayer.src = '';
      }
    }

    // NATIVA: RECEPCIÓN DE ARCHIVOS DESDE JAVA
    window.recibirBibliotecaNativa = function(biblioteca, covers) {
      bibliotecaNativa = biblioteca || {};
      coversNativas = covers || {};
      renderizarAlbumes();
    };

    function renderizarAlbumes() {
      const contenedor = document.getElementById('contenedor-albumes');
      contenedor.innerHTML = '';

      const albumes = Object.keys(bibliotecaNativa);

      if (albumes.length === 0) {
        contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron canciones.</p>';
        return;
      }

      albumes.forEach(albumKey => {
        const card = document.createElement('div');
        card.className = 'card-album';
        card.onclick = () => abrirAlbum(albumKey);

        const coverSrc = coversNativas[albumKey.toLowerCase()] || 'icon.png';
        
        card.innerHTML = `
          <img src="${coverSrc}" alt="${albumKey}">
          <div style="font-size:0.9rem; font-weight:600;">${albumKey}</div>
        `;
        contenedor.appendChild(card);
      });
    }

    function abrirAlbum(albumKey) {
      albumActualNombre = albumKey;
      listaCancionesActuales = bibliotecaNativa[albumKey] || [];
      
      document.getElementById('nombre-album-actual').innerText = albumKey;
      const contenedor = document.getElementById('contenedor-canciones');
      contenedor.innerHTML = '';

      listaCancionesActuales.forEach((cancion, index) => {
        const item = document.createElement('li');
        item.className = 'item-cancion';
        item.onclick = () => reproducirCancion(index);
        item.innerHTML = `
          <span>${cancion.nombre}</span>
          <span>▶</span>
        `;
        contenedor.appendChild(item);
      });

      navegarA('vista-canciones');
    }

    // 5.1 REPRODUCCIÓN Y AUTO-PLAY
    function reproducirCancion(index) {
      indiceCancionActual = index;
      const cancion = listaCancionesActuales[indiceCancionActual];

      if (!cancion) return;

      audioPlayer.src = cancion.archivo;
      
      // Actualizar datos de pantalla
      document.getElementById('player-song-title').innerText = cancion.nombre;
      document.getElementById('player-album-title').innerText = albumActualNombre;
      
      const coverSrc = coversNativas[albumActualNombre.toLowerCase()] || 'icon.png';
      document.getElementById('player-cover-img').src = coverSrc;

      navegarA('vista-player');

      // 5.1 Auto-reproducir inmediatamente
      audioPlayer.play().then(() => {
        actualizarBotonPlayPause(true);
      }).catch(e => console.log("Error al reproducir audio:", e));
    }

    function togglePlayPause() {
      if (audioPlayer.paused) {
        audioPlayer.play();
        actualizarBotonPlayPause(true);
      } else {
        audioPlayer.pause();
        actualizarBotonPlayPause(false);
      }
    }

    function actualizarBotonPlayPause(reproduciendo) {
      document.getElementById('btn-play-pause').innerText = reproduciendo ? '⏸' : '▶';
    }

    function cancionSiguiente() {
      if (indiceCancionActual + 1 < listaCancionesActuales.length) {
        reproducirCancion(indiceCancionActual + 1);
      } else {
        reproducirCancion(0); // Vuelve al inicio si acaba el álbum
      }
    }

    function cancionAnterior() {
      if (indiceCancionActual - 1 >= 0) {
        reproducirCancion(indiceCancionActual - 1);
      }
    }

    // 5.4 Continuar a la siguiente canción al terminar
    audioPlayer.addEventListener('ended', () => {
      cancionSiguiente();
    });

    // 5.5 Parar canción al pulsar "< VOLVER A CANCIONES"
    function volverACanciones() {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      actualizarBotonPlayPause(false);
      navegarA('vista-canciones');
    }

    // 5. LÓGICA TV NEWS (Sin poster / Transición limpia)
    function cambiarCanalTV(url) {
      tvVideo.removeAttribute('poster');
      tvVideo.src = url;
      tvVideo.play().catch(() => {});
    }

    // LÓGICA RADIO
    function sintonizarRadio(nombre, url) {
      document.getElementById('radio-estacion-actual').innerText = nombre;
      radioPlayer.src = url;
      radioPlayer.play().then(() => {
        document.getElementById('btn-radio-play').innerText = '⏸';
      }).catch(e => console.log(e));
    }

    function toggleRadioPlay() {
      if (radioPlayer.paused) {
        radioPlayer.play();
        document.getElementById('btn-radio-play').innerText = '⏸';
      } else {
        radioPlayer.pause();
        document.getElementById('btn-radio-play').innerText = '▶';
      }
    }

    // SOLICITAR CARGA NATIVA AL INICIAR
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AndroidBridge && window.AndroidBridge.cargarMusica) {
        window.AndroidBridge.cargarMusica();
      }
    });
  </script>
</body>
</html>
