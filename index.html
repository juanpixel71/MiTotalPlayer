<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <div class="header">MI TOTAL PLAYER</div>
      <div class="view-content" style="justify-content: space-between;">
        <button class="btn-main-home" onclick="navigateTo('screen-tv')"><span>📺</span> TV-NEWS</button>
        <button class="btn-main-home" onclick="ejecutarAccionMusica()"><span>🎵</span> MÚSICA</button>
        <input type="file" id="folder-input" webkitdirectory directory multiple onchange="window.cargarBibliotecaLocal(event)" style="display:none;">

        <button class="btn-main-home" onclick="navigateTo('screen-radio')"><span>📻</span> RADIO</button>
        <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
      </div>
    </div>

<!--1. ENCABEZADO TV-NEWS -->
<div id="screen-tv" class="screen">
  <div class="header">TV-NEWS</div>
  <div class="view-content">
    <div class="tv-container">
      
      <!-- 2. Caja contenedora del Vídeo -->
      <div class="tv-video-box">
        <video id="tv-video" controls autoplay playsinline webkit-playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
      </div>
      
      <!-- 3. Rejilla con los botones de tus canales de TV -->
      <div class="tv-controls-box">
        <div class="grid-buttons">
          <!-- Vacío: Aquí el Gist meterá los botones automáticamente al arrancar -->
        </div>
        
        <button class="btn-nav-back btn-nav-back-landscape" onclick="navigateTo('screen-home')">&lt; VOLVER HOME</button>
      </div>
    </div>



    <!-- 4. CONTROLES DE REPRODUCCIÓN (Mismo estilo, orden y emojis que Música/Radio) -->
    <div class="media-controls-square" style="margin-bottom: 10px;">
      <button class="btn-square" onclick="prevChannel()">⏮</button>
      <button id="btn-tv-play" class="btn-square btn-square-main" onclick="togglePlayTV()">▶</button>
      <button class="btn-square" onclick="nextChannel()">⏭</button>
    </div>
    
    <button class="btn-nav-back" onclick="navigateTo('screen-home')">&lt; VOLVER HOME</button>
  </div>
</div>


    <!-- ÁLBUMES -->
    <div id="screen-albums" class="screen">
      <div class="header">ÁLBUMES</div>
      <div class="view-content">
        <div id="albums-container" class="albums-grid"></div>
        <button class="btn-nav-back" onclick="navigateTo('screen-home')">&lt; VOLVER HOME</button>
      </div>
    </div>

    <!-- CANCIONES -->
    <div id="screen-songs" class="screen">
      <div id="album-header" class="header">ÁLBUM</div>
      <div class="view-content">
        <div id="songs-container" class="song-list"></div>
        <button class="btn-nav-back" onclick="navigateTo('screen-albums')">&lt; VOLVER ÁLBUMES</button>
      </div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="screen-player" class="screen">
      <div class="header">REPRODUCIENDO</div>
      <div class="view-content">
        <div class="player-view-drive">
          <div class="album-cover-drive" id="player-cover">
            <span id="player-cover-icon" style="font-size: 5rem; color: #FFF;">🎵</span>
          </div>
          <div class="track-details-drive">
            <h3 id="player-song-title">Canción</h3>
            <p id="player-album-info">Álbum</p>
          </div>
          <div class="progress-bar-container">
            <span id="current-time" class="time-stamp">0:00</span>
            <input type="range" id="seek-bar" class="progress-bar" value="0" min="0" step="1">
            <span id="total-time" class="time-stamp" style="text-align: right;">0:00</span>
          </div>
          <div class="media-controls-square">
            <button class="btn-square" onclick="prevSong()">⏮</button>
            <button class="btn-square btn-square-main" id="btn-play-pause" onclick="togglePlayMusic()">▶</button>
            <button class="btn-square" onclick="nextSong()">⏭</button>
          </div>
          <audio id="audio-element"></audio>
        </div>
        <button class="btn-nav-back" onclick="pararYVolverCanciones()">&lt; VOLVER A CANCIONES</button>
      </div>
    </div>

    <!-- RADIO -->
    <div id="screen-radio" class="screen">
      <div class="header">RADIO</div>
      <div class="view-content">
        <div class="radio-display"><span style="font-size: 4.5rem;">📻</span></div>
        <div class="grid-buttons" id="radio-buttons-container">
</div>   
        
        <div class="progress-bar-container">
          <span id="radio-current-time" class="time-stamp">0:00</span>
          <input type="range" id="radio-seek-bar" class="progress-bar" value="0" min="0" step="1">
          <span id="radio-total-time" class="time-stamp" style="text-align: right;">LIVE</span>
        </div>
        <div class="media-controls-square">
          <button class="btn-square" onclick="prevRadio()">⏮</button>
         <button id="btn-radio-play" class="btn-square btn-square-main" onclick="togglePlayRadio()">▶</button>
          <button class="btn-square" onclick="nextRadio()">⏭</button>
        </div>
        <audio id="radio-audio-element"></audio>
        <button class="btn-nav-back" onclick="navigateTo('screen-home')">&lt; VOLVER HOME</button>
      </div>
    </div>

  </div>

  <script src="bridge-music.js"></script>
  <script src="app.js"></script>
</body>
</html>
