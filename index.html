<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #3C3C3B;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Punto 7: Header con padding-top para librar el notch */
    .app-header {
      background-color: #3C3C3B;
      padding: max(16px, env(safe-area-inset-top)) 16px 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .time-display {
      font-size: 1rem;
      color: #9D9D9C;
      font-weight: 500;
    }

    .screen {
      display: none;
      flex: 1;
      padding: 16px;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    .btn-main {
      background-color: #2A2A2A;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      width: 100%;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-main.active, .btn-main:active {
      background-color: #D32F2F;
      border-color: #D32F2F;
    }

    .btn-back {
      background-color: #1A1A1A;
      color: #9D9D9C;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-top: auto;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .album-card-clean {
      background-color: #2A2A2A;
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }

    .album-card-clean.active {
      border: 2px solid #D32F2F;
    }

    .song-item {
      background-color: #2A2A2A;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .song-item.active {
      background-color: #D32F2F;
      color: #FFFFFF;
    }

    .video-container {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      margin-bottom: 12px;
    }

    iframe, video {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* TV Landscape Inmersivo */
    .tv-landscape-layout {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }

    @media (orientation: landscape) {
      .tv-screen-active .tv-landscape-layout {
        display: flex;
        flex-direction: row;
      }
      .tv-screen-active .tv-portrait-layout,
      .tv-screen-active .app-header {
        display: none !important;
      }
    }

    .tv-landscape-video {
      flex: 1;
      height: 100%;
      background: #000;
    }

    .tv-landscape-controls {
      width: 220px;
      background: #1A1A1A;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .tv-landscape-controls .btn-main {
      padding: 10px;
      font-size: 0.85rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-title">TOTAL PLAYER</div>
    <div class="time-display" id="clock">00:00</div>
  </header>

  <!-- PANTALLA 1: HOME -->
  <section id="screen-home" class="screen active">
    <button class="btn-main" onclick="abrirSeleccionMusica()">MÚSICA <span>&#10095;</span></button>
    <button class="btn-main" onclick="navigateTo('screen-radio')">RADIO <span>&#10095;</span></button>
    <button class="btn-main" onclick="navigateTo('screen-tv')">TV-NEWS <span>&#10095;</span></button>
    
    <!-- Punto 1: Botón volver/salir corregido -->
    <button class="btn-back" onclick="salirApp()">&lt; VOLVER Y SALIR</button>
    <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none" onchange="cargarBibliotecaLocal(event)">
  </section>

  <!-- PANTALLA 2: ÁLBUMES -->
  <section id="screen-albums" class="screen">
    <div class="grid-2" id="albums-container"></div>
    <button class="btn-back" onclick="navigateTo('screen-home')">&lt; VOLVER A INICIO</button>
  </section>

  <!-- PANTALLA 3: CANCIONES -->
  <section id="screen-songs" class="screen">
    <div id="songs-container" style="flex:1; overflow-y:auto; margin-bottom:12px;"></div>
    <button class="btn-back" onclick="navigateTo('screen-albums')">&lt; VOLVER A ÁLBUMES</button>
  </section>

  <!-- PANTALLA 4: REPRODUCTOR MÚSICA AMPLIADA -->
  <section id="screen-player" class="screen">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div id="player-cover" style="width:220px; height:220px; background:#2A2A2A; border-radius:12px; margin-bottom:20px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="color:#9D9D9C;">SIN PORTADA</span>
      </div>
      <h3 id="player-title" style="margin-bottom:8px; text-align:center;">Título Canción</h3>
      <p id="player-album" style="color:#9D9D9C; font-size:0.9rem; margin-bottom:20px;">Álbum</p>
      
      <audio id="audio-element" controls style="width:100%; max-width:320px;"></audio>
    </div>
    <button class="btn-back" onclick="navigateTo('screen-songs')">&lt; VOLVER A CANCIONES</button>
  </section>

  <!-- PANTALLA 5: RADIO -->
  <section id="screen-radio" class="screen">
    <div style="flex:1;">
      <button class="btn-main" onclick="playRadio('http://directo.radio3.rne.cast.addradio.es/rne_radio3_main.mp3', this)">RADIO 3</button>
      <button class="btn-main" onclick="playRadio('https://31433.live.streamtheworld.com/CADENASER.mp3', this)">CADENA SER</button>
      <button class="btn-main" onclick="playRadio('https://25633.live.streamtheworld.com/COPE_AAC.mp3', this)">COPE</button>
      <button class="btn-main" onclick="playRadio('https://22533.live.streamtheworld.com/ONDACERO.mp3', this)">ONDA CERO</button>
      <button class="btn-main" onclick="playRadio('https://22543.live.streamtheworld.com/RAC1.mp3', this)">RAC1</button>
    </div>
    <audio id="radio-element" style="display:none;"></audio>
    <button class="btn-back" onclick="detenerRadio(); navigateTo('screen-home')">&lt; VOLVER A INICIO</button>
  </section>

  <!-- PANTALLA 6: TV-NEWS -->
  <section id="screen-tv" class="screen">
    <!-- Puntos 2.1 y 2.2: Portrait limpio con iframe de TV directamente -->
    <div class="tv-portrait-layout" style="flex:1; display:flex; flex-direction:column;">
      <div class="video-container" id="tv-portrait-player">
        <iframe id="tv-iframe-portrait" src="https://www.youtube.com/embed/live_stream?channel=UC835A1cWJ-L__8mY-L91L8w" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div style="flex:1; overflow-y:auto;">
        <button class="btn-main" onclick="cambiarCanalTV('https://www.youtube.com/embed/live_stream?channel=UC835A1cWJ-L__8mY-L91L8w', this)">24H TVE</button>
        <button class="btn-main" onclick="cambiarCanalTV('https://www.youtube.com/embed/live_stream?channel=UC2aC_016T0XThpL10L993Yg', this)">324 CATALUNYA</button>
        <button class="btn-main" onclick="cambiarCanalTV('https://www.youtube.com/embed/live_stream?channel=UC4S3332_LpxX4n4O4J-YyDg', this)">EURONEWS</button>
      </div>
      <!-- En Portrait sí mantenemos volver a inicio -->
      <button class="btn-back" onclick="navigateTo('screen-home')">&lt; VOLVER A INICIO</button>
    </div>

    <!-- Layout Landscape Inmersivo -->
    <div class="tv-landscape-layout">
      <div class="tv-landscape-video">
        <iframe id="tv-iframe-landscape" src="https://www.youtube.com/embed/live_stream?channel=UC835A1cWJ-L__8mY-L91L8w" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="tv-landscape-controls">
        <button class="btn-main" onclick="cambiarCanalTV('https://www.youtube.com/embed/live_stream?channel=UC835A1cWJ-L__8mY-L91L8w', this)">24H TVE</button>
        <button class="btn-main" onclick="cambiarCanalTV('https://www.youtube.com/embed/live_stream?channel=UC2aC_016T0XThpL10L993Yg', this)">324 CATALUNYA</button>
        <button class="btn-main" onclick="cambiarCanalTV('https://www.youtube.com/embed/live_stream?channel=UC4S3332_LpxX4n4O4J-YyDg', this)">EURONEWS</button>
        <!-- Punto 3.1: Añadido el botón < VOLVER al final en Landscape -->
        <button class="btn-back" style="margin-top:auto;" onclick="navigateTo('screen-home')">&lt; VOLVER</button>
      </div>
    </div>
  </section>

  <script src="bridge-music.js"></script>
  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let albumActual = '';
    let biblioteca = {};

    function navigateTo(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      
      if (screenId === 'screen-tv') {
        document.body.classList.add('tv-screen-active');
      } else {
        document.body.classList.remove('tv-screen-active');
      }

      if (typeof window.gestionarModoPantalla === 'function') {
        window.gestionarModoPantalla(screenId);
      }
    }

    function salirApp() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.exitApp();
      } else {
        alert("Cerrando aplicación...");
      }
    }

    function playRadio(url, btn) {
      document.querySelectorAll('#screen-radio .btn-main').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      const audio = document.getElementById('radio-element');
      audio.src = url;
      audio.play();
    }

    function detenerRadio() {
      const audio = document.getElementById('radio-element');
      audio.pause();
      audio.src = '';
    }

    function cambiarCanalTV(url, btn) {
      document.querySelectorAll('.btn-main').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      document.getElementById('tv-iframe-portrait').src = url;
      document.getElementById('tv-iframe-landscape').src = url;
    }

    function showSongs(album) {
      albumActual = album;
      const container = document.getElementById('songs-container');
      container.innerHTML = '';
      
      const canciones = biblioteca[album] || [];
      canciones.forEach((cancion, idx) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerText = `${idx + 1}. ${cancion.nombre}`;
        item.onclick = () => {
          document.querySelectorAll('.song-item').forEach(s => s.classList.remove('active'));
          item.classList.add('active');
          reproducirMusica(cancion, album);
        };
        container.appendChild(item);
      });

      navigateTo('screen-songs');
    }

    function reproducirMusica(cancion, album) {
      document.getElementById('player-title').innerText = cancion.nombre;
      document.getElementById('player-album').innerText = album;
      
      const coverBox = document.getElementById('player-cover');
      if (window.coversAlbumes && window.coversAlbumes[album]) {
        coverBox.innerHTML = `<img src="${window.coversAlbumes[album]}" style="width:100%; height:100%; object-fit:cover;">`;
      } else {
        coverBox.innerHTML = `<span style="color:#9D9D9C;">SIN PORTADA</span>`;
      }

      const audio = document.getElementById('audio-element');
      audio.src = cancion.archivo;
      audio.play();

      navigateTo('screen-player');
    }

    function formatearNombreAlbum(nombre) {
      return nombre.replace(/^(\d+)[._\s-]*/, '$1. ');
    }
  </script>
</body>
</html>
